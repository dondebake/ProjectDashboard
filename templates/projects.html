<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Management - Project Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/projects.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">
                <i class="fas fa-chart-line me-2"></i>
                Project Dashboard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}"><i class="fas fa-tachometer-alt me-1"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('projects_page') }}"><i class="fas fa-project-diagram me-1"></i>Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('gantt_page') }}"><i class="fas fa-chart-gantt me-1"></i>GANTT Chart</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('team_page') }}"><i class="fas fa-users me-1"></i>Team</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Page Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <h2><i class="fas fa-project-diagram me-2"></i>Projects Management</h2>
                    <button class="btn btn-primary" onclick="showCreateProjectModal()">
                        <i class="fas fa-plus me-1"></i>New Project
                    </button>
                </div>
            </div>
        </div>

        <!-- Projects Grid -->
        <div class="row" id="projects-grid">
            <!-- Projects will be loaded here -->
        </div>
    </div>

    <!-- Create/Edit Project Modal -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="projectModalTitle">New Project</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="projectForm">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="projectName" class="form-label">Project Name *</label>
                                    <input type="text" class="form-control" id="projectName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="projectClient" class="form-label">Client (Opdrachtgever) *</label>
                                    <input type="text" class="form-control" id="projectClient" required>
                                </div>
                                <div class="mb-3">
                                    <label for="projectManager" class="form-label">Project Manager</label>
                                    <input type="text" class="form-control" id="projectManager">
                                </div>
                                <div class="mb-3">
                                    <label for="projectBudget" class="form-label">Budget (€)</label>
                                    <input type="number" class="form-control" id="projectBudget" min="0" step="0.01">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="projectStatus" class="form-label">Status</label>
                                    <select class="form-select" id="projectStatus">
                                        <option value="Active">Active</option>
                                        <option value="On Hold">On Hold</option>
                                        <option value="Completed">Completed</option>
                                        <option value="Cancelled">Cancelled</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="projectPriority" class="form-label">Priority</label>
                                    <select class="form-select" id="projectPriority">
                                        <option value="Low">Low</option>
                                        <option value="Medium" selected>Medium</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="projectStartDate" class="form-label">Start Date *</label>
                                    <input type="date" class="form-control" id="projectStartDate" required>
                                </div>
                                <div class="mb-3">
                                    <label for="projectEndDate" class="form-label">End Date</label>
                                    <input type="date" class="form-control" id="projectEndDate">
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="projectDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="projectDescription" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="saveProjectBtn">Save Project</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Project Details Modal -->
    <div class="modal fade" id="projectDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="projectDetailsTitle">Project Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <!-- Project Info -->
                        <div class="col-md-8">
                            <div class="card mb-3">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <h6 class="mb-0"><i class="fas fa-info-circle me-1"></i>Project Information</h6>
                                    <div class="btn-group">
                                        <button class="btn btn-sm btn-outline-primary" onclick="editProject()">
                                            <i class="fas fa-edit me-1"></i>Edit
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProject()">
                                            <i class="fas fa-trash me-1"></i>Delete
                                        </button>
                                    </div>
                                </div>
                                <div class="card-body" id="projectInfo">
                                    <!-- Project details will be loaded here -->
                                </div>
                            </div>

                            <!-- Tasks Section -->
                            <div class="card">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <h6 class="mb-0"><i class="fas fa-tasks me-1"></i>Tasks</h6>
                                    <button class="btn btn-sm btn-primary" onclick="showCreateTaskModal()">
                                        <i class="fas fa-plus me-1"></i>New Task
                                    </button>
                                </div>
                                <div class="card-body">
                                    <div id="tasksList">
                                        <!-- Tasks will be loaded here -->
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Team Members Sidebar -->
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <h6 class="mb-0"><i class="fas fa-users me-1"></i>Team Members</h6>
                                    <button class="btn btn-sm btn-primary" onclick="showAddTeamMemberModal()">
                                        <i class="fas fa-user-plus me-1"></i>Add
                                    </button>
                                </div>
                                <div class="card-body">
                                    <div id="teamMembersList">
                                        <!-- Team members will be loaded here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="taskForm">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="taskTitle" class="form-label">Task Title *</label>
                                    <input type="text" class="form-control" id="taskTitle" required>
                                </div>
                                <div class="mb-3">
                                    <label for="taskPriority" class="form-label">Priority</label>
                                    <select class="form-select" id="taskPriority">
                                        <option value="Low">Low</option>
                                        <option value="Medium" selected>Medium</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="taskEstimatedHours" class="form-label">Estimated Hours</label>
                                    <input type="number" class="form-control" id="taskEstimatedHours" min="0" step="0.5">
                                </div>
                                <div class="mb-3">
                                    <label for="taskDurationDays" class="form-label">Duration (Working Days)</label>
                                    <input type="number" class="form-control" id="taskDurationDays" min="1" value="1">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="taskStartDate" class="form-label">Start Date</label>
                                    <input type="date" class="form-control" id="taskStartDate">
                                </div>
                                <div class="mb-3">
                                    <label for="taskEndDate" class="form-label">End Date</label>
                                    <input type="date" class="form-control" id="taskEndDate">
                                </div>
                                <div class="mb-3">
                                    <label for="taskDueDate" class="form-label">Due Date</label>
                                    <input type="date" class="form-control" id="taskDueDate">
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="taskDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="taskDescription" rows="3"></textarea>
                        </div>
                        
                        <!-- Task Assignments -->
                        <h6><i class="fas fa-user-clock me-1"></i>Task Assignments</h6>
                        <div id="taskAssignments">
                            <div class="assignment-row mb-3">
                                <div class="row align-items-end">
                                    <div class="col-md-3">
                                        <label class="form-label">Team Member</label>
                                        <select class="form-select assignment-member">
                                            <option value="">Select member...</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">Hours/Week</label>
                                        <input type="number" class="form-control assignment-hours-per-week" min="1" max="40" step="0.5">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">Weeks</label>
                                        <input type="number" class="form-control assignment-weeks" min="0.5" step="0.5">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">Total Hours</label>
                                        <input type="number" class="form-control assignment-total-hours" readonly>
                                    </div>
                                    <div class="col-md-3">
                                        <button type="button" class="btn btn-sm btn-success me-1" onclick="addAssignmentRow()">
                                            <i class="fas fa-plus"></i>
                                        </button>
                                        <button type="button" class="btn btn-sm btn-danger" onclick="removeAssignmentRow(this)">
                                            <i class="fas fa-minus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Team Member Modal -->
    <div class="modal fade" id="addTeamMemberModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Team Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="availableMembers" class="form-label">Select Team Member</label>
                        <select class="form-select" id="availableMembers">
                            <option value="">Choose a team member...</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addTeamMemberToProject()">Add to Project</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/projects.js') }}"></script>
</body>
</html>
