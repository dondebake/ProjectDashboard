<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GANTT Chart - Project Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css" rel="stylesheet">
    <style>
        .non-working-rect,
        .holiday-rect {
            pointer-events: none;
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">
                <i class="fas fa-chart-line me-2"></i>Project Dashboard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}"><i class="fas fa-tachometer-alt me-1"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('projects_page') }}"><i class="fas fa-project-diagram me-1"></i>Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('gantt_page') }}"><i class="fas fa-chart-gantt me-1"></i>GANTT Chart</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('team_page') }}"><i class="fas fa-users me-1"></i>Team</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <h2 class="mb-0"><i class="fas fa-chart-gantt me-2"></i>Project GANTT Chart</h2>
                    <div class="d-flex gap-2">
                        <select id="project-selector" class="form-select">
                            <option value="">All Projects</option>
                        </select>
                        <button id="refresh-btn" class="btn btn-outline-primary">
                            <i class="fas fa-sync-alt me-1"></i>Refresh
                        </button>
                        <button id="add-task-btn" class="btn btn-success">
                            <i class="fas fa-plus me-1"></i>New Task
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-3" id="currentProjectInfo" style="display:none;">
            <div class="col-12">
                <div class="alert alert-info d-flex align-items-center justify-content-between">
                    <div>
                        <i class="fas fa-info-circle me-2"></i>
                        Viewing project: <strong id="currentProjectName"></strong>
                    </div>
                    <button class="btn btn-sm btn-outline-secondary" onclick="ganttManager.setProjectFilter(null)">
                        <i class="fas fa-times me-1"></i>Show All
                    </button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-clock me-2"></i>Timeline</h5>
                        <select id="view-mode" class="form-select form-select-sm" style="width:auto;" onchange="if(window.ganttManager && window.ganttManager.gantt){ window.ganttManager.gantt.change_view_mode(this.value); }">
                            <option value="Day">Day</option>
                            <option value="Week" selected>Week</option>
                            <option value="Month">Month</option>
                            <option value="Quarter">Quarter</option>
                        </select>
                    </div>
                    <div class="card-body" style="height:600px;padding:0;">
                        <div id="gantt" style="width:100%;height:100%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div class="modal fade" id="task-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">Task</h5>
                    <button type="button" class="btn-close close" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="task-form">
                        <input type="hidden" id="task-id">
                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label class="form-label">Title *</label>
                                <input type="text" class="form-control" id="task-title" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Project *</label>
                                <select class="form-select" id="task-project" required></select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="task-description" rows="3"></textarea>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="task-status">
                                    <option value="To Do">To Do</option>
                                    <option value="In Progress">In Progress</option>
                                    <option value="Completed">Completed</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Priority</label>
                                <select class="form-select" id="task-priority">
                                    <option value="Low">Low</option>
                                    <option value="Medium" selected>Medium</option>
                                    <option value="High">High</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Estimated Hours</label>
                                <input type="number" class="form-control" id="task-estimated-hours" min="0" step="0.5">
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Actual Hours</label>
                                <input type="number" class="form-control" id="task-actual-hours" min="0" step="0.5">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="task-start-date">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">End Date</label>
                                <input type="date" class="form-control" id="task-end-date">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Due Date</label>
                            <input type="date" class="form-control" id="task-due-date">
                        </div>
                        <div class="mb-3">
                            <label class="form-label d-flex justify-content-between align-items-center">
                                <span>Dependencies</span>
                                <button type="button" class="btn btn-sm btn-outline-secondary" id="manage-dependencies-btn">
                                    <i class="fas fa-link me-1"></i>Manage
                                </button>
                            </label>
                            <div id="task-dependency-summary" class="small text-muted">Dependencies will be listed here.</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="ganttManager.closeTaskModal()">Cancel</button>
                    <button type="button" class="btn btn-danger" id="delete-task-btn" style="display:none;">
                        <i class="fas fa-trash me-1"></i>Delete
                    </button>
                    <button type="button" class="btn btn-primary" id="save-task-btn">
                        <i class="fas fa-save me-1"></i>Save
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Dependency Modal -->
    <div class="modal fade" id="dependency-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-link me-2"></i>Manage Dependencies</h5>
                    <button type="button" class="btn-close" aria-label="Close" onclick="ganttManager.closeDependencyModal()"></button>
                </div>
                <div class="modal-body">
                    <form id="dependency-form" class="mb-3">
                        <div class="mb-3">
                            <label class="form-label">Predecessor Task</label>
                            <select class="form-select" id="dependency-predecessor" required></select>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Dependency Type</label>
                                <select class="form-select" id="dependency-type">
                                    <option value="FS">Finish to Start</option>
                                    <option value="SS">Start to Start</option>
                                    <option value="FF">Finish to Finish</option>
                                    <option value="SF">Start to Finish</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Lag (days)</label>
                                <input type="number" class="form-control" id="dependency-lag" value="0" step="1">
                            </div>
                        </div>
                        <div class="text-end mt-3">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save Dependency</button>
                        </div>
                    </form>
                    <h6>Current Dependencies</h6>
                    <div id="dependency-list" class="list-group small">
                        <div class="text-muted">No dependencies defined.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="ganttManager.closeDependencyModal()">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="d-none position-fixed top-50 start-50 translate-middle">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:2000;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
    <script src="{{ url_for('static', filename='js/gantt_new.js') }}"></script>
</body>
</html>
